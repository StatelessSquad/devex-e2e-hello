name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -v /tmp/gitleaks:/root/.gitleaks ghcr.io/gitleaks/gitleaks:latest detect --source /src --verbose
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1
      - name: Tests
        run: make test
