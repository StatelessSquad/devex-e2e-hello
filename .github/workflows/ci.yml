name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks via docker image: free for organizations (gitleaks-action needs a paid license for orgs)
      - name: Run gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/src ghcr.io/gitleaks/gitleaks:latest detect --source /src --no-banner --redact --exit-code 1
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1
      - name: Tests
        run: make test
